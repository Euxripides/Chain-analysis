openapi: 3.1.0
info:
  title: 双系统认证 API
  version: 1.0.0
  description: |
    docs/dual-system-development-plan.md §21.4 的实现契约。

    身份只由服务端会话确定：会话令牌是不透明随机串，存于 HttpOnly Cookie，
    数据库只保存 SHA-256。前端永远拿不到令牌本体。

    写操作（POST/DELETE/PATCH）必须携带 `X-CSRF-Token`，其值来自可读的
    `cs_{user,admin}_session_csrf` Cookie（double-submit 校验）。

    受众（audience）由 `X-Auth-Audience` 显式声明；该头部只能**收窄**
    服务端接受的受众，不能放宽授权。
servers:
  - url: /
tags:
  - name: auth
paths:
  /api/auth/v1/methods:
    get:
      operationId: listAuthMethods
      summary: 列出可用登录方式与是否需要 MFA
      tags: [auth]
      security: []
      responses:
        '200':
          description: 登录方式
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common/envelope.yaml#/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          local: { type: boolean }
                          oidc: { type: boolean, description: 当前恒为 false（未接入 IdP） }
                          mfa_required: { type: boolean }
                          audiences:
                            type: array
                            items: { type: string, enum: [user, admin] }
        '401':
          description: 未认证或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 缺少所需权限或 CSRF 校验失败
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/login:
    post:
      operationId: login
      summary: 本地账户登录，下发 HttpOnly 会话 Cookie
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: 邮箱，大小写不敏感 }
                password: { type: string, writeOnly: true, description: 绝不写日志或审计 }
                audience: { type: string, enum: [user, admin], default: user }
                return_to: { type: string, description: 应用内相对路径；绝对 URL 会被中和 }
      responses:
        '200':
          description: 登录成功并设置 Cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common/envelope.yaml#/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [state, user, roles, audience, next, csrf_token]
                        properties:
                          state: { type: string, enum: [authenticated] }
                          user:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              display_name: { type: string }
                              email: { type: string }
                          roles: { type: array, items: { type: string } }
                          audience: { type: string, enum: [user, admin] }
                          next: { type: string, description: 应用内相对路径（不含挂载前缀） }
                          csrf_token: { type: string }
                          session_id: { type: string, format: uuid }
                          must_change_password: { type: boolean }
        '401':
          description: 账号或密码不正确（未知账号与密码错误外观完全一致，避免账号枚举）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 账号已停用
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '423':
          description: 账号因连续失败被锁定
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '429':
          description: 登录尝试过于频繁；响应带 Retry-After
          headers:
            Retry-After:
              schema: { type: integer }
              description: 建议重试等待秒数（§27 SEC-004）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/logout:
    post:
      operationId: logout
      summary: 撤销当前会话并清除 Cookie
      tags: [auth]
      responses:
        '200':
          description: 已退出（幂等：无会话时同样返回成功）
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '401':
          description: 未认证或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 缺少所需权限或 CSRF 校验失败
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/refresh:
    post:
      operationId: refreshSession
      summary: 轮换会话令牌（旧令牌重放会撤销整个会话族）
      description: |
        每次调用生成**新的一行**会话并沿用同一 family_id，旧行标记为 rotated。
        若旧令牌再次被使用，服务端判定为令牌泄露并撤销整个家族（§27 AUTH-005）。
      tags: [auth]
      responses:
        '200':
          description: 已轮换，新令牌写入 Cookie
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '401':
          description: 会话缺失、失效，或检测到令牌重放（AUTHN_SESSION_REUSE）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/session:
    get:
      operationId: getSession
      summary: 当前身份、角色、权限集合与 CSRF 令牌
      tags: [auth]
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common/envelope.yaml#/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user, roles, permissions, audience, csrf_token]
                        properties:
                          user:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              display_name: { type: string }
                              email: { type: string }
                          roles: { type: array, items: { type: string } }
                          permissions:
                            type: array
                            items: { type: string }
                            description: resource:action 形式的授权事实来源
                          audience: { type: string, enum: [user, admin] }
                          organization_id: { type: string, format: uuid }
                          workspace_id: { type: string, format: uuid }
                          session_id: { type: string, format: uuid }
                          csrf_token: { type: string }
                          expires_at: { type: string, format: date-time }
                          absolute_expires_at: { type: string, format: date-time }
                          must_change_password: { type: boolean }
                          mfa_satisfied: { type: boolean }
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/session/workspaces:
    get:
      operationId: listSessionWorkspaceOptions
      summary: 当前身份在当前组织内可选的工作区（只返回 active 成员资格，不读组织默认值）
      tags: [auth]
      responses:
        '200':
          description: 可选工作区列表
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/session/workspace:
    post:
      operationId: switchSessionWorkspace
      summary: 把当前会话切换到同一组织内的另一个成员工作区
      description: |
        目标必须是该身份的 active 成员资格，否则 fail closed 且不改动现有会话。
        非 GET 请求必须携带 CSRF double-submit 令牌；成功后写
        authorization.workspace_switched 审计。
        会话离开旧工作区时，服务端会主动关闭该会话在旧作用域下建立的全部 SSE
        订阅（审计 action job.events.scope_invalidated）。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id]
              properties:
                workspace_id: { type: string, format: uuid }
      responses:
        '200':
          description: 切换成功（state=switched）或目标与当前一致（state=unchanged）
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 缺少成员资格，或 CSRF 校验失败（csrf_failed）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '409':
          description: 会话状态已变化（AUTHZ_WORKSPACE_SWITCH_CONFLICT）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/sessions:
    get:
      operationId: listOwnSessions
      summary: 当前身份的全部会话
      tags: [auth]
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '401':
          description: 未认证或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 缺少所需权限或 CSRF 校验失败
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/sessions/{id}:
    delete:
      operationId: revokeOwnSession
      summary: 撤销自己的一个会话
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已撤销
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '404':
          description: 会话不存在或不属于当前身份（统一 404，避免枚举）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '401':
          description: 未认证或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 缺少所需权限或 CSRF 校验失败
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/devices:
    get:
      operationId: listDevices
      summary: 当前身份的设备列表（客户端声明，非身份结论）
      tags: [auth]
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '401':
          description: 未认证或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 缺少所需权限或 CSRF 校验失败
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/devices/{id}:
    patch:
      operationId: updateDevice
      summary: 修改设备名称或信任状态
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_label: { type: string, maxLength: 200 }
                trust_days: { type: integer, minimum: 0, maximum: 365 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '401':
          description: 未认证或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 缺少所需权限或 CSRF 校验失败
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      summary: 撤销该身份的全部会话（可选保留当前）
      tags: [auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                keep_current: { type: boolean, default: false }
      responses:
        '200':
          description: 已撤销，返回撤销数量
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '401':
          description: 未认证或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 缺少所需权限或 CSRF 校验失败
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/password/change:
    post:
      operationId: changePassword
      summary: 修改密码并撤销该身份的全部会话
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, writeOnly: true }
                new_password: { type: string, writeOnly: true, minLength: 12 }
      responses:
        '200':
          description: 已修改；全部会话被撤销，需重新登录
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '401':
          description: 当前密码不正确
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/mfa/verify:
    post:
      operationId: verifyMfa
      summary: 校验 TOTP / 恢复码（登录第二步或已登录 step-up）
      description: |
        两种用法：
        * 登录第二步：body 带 `challenge_id`（`POST /api/auth/v1/login` 需要 MFA 时返回 202 并给出）。
          无会话即可调用，成功后建会话并下发 Cookie；挑战单次使用、5 分钟过期、最多 5 次尝试。
        * 已登录用户的 step-up：带会话且只给 `code`，成功返回 `verified=true`。
        两条路径都不区分“码错”与“重放”，也不回显任何期望值。
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 6 位 TOTP 验证码或一次性恢复码 }
                challenge_id: { type: string, description: 登录第二步的挑战 id；自助 step-up 时留空 }
                return_to: { type: string, description: 仅登录第二步使用，应用内相对路径 }
      responses:
        '200':
          description: |
            校验通过。登录第二步同时下发会话 Cookie（HttpOnly）；
            自助 step-up 返回 verified / used_recovery_code。
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '401':
          description: AUTHN_MFA_INVALID（验证码不正确）或 AUTHN_MFA_CHALLENGE_INVALID（挑战已失效，需重新登录）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 缺少所需权限或 CSRF 校验失败
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '409':
          description: AUTHN_MFA_NOT_ENROLLED（该账号未启用 MFA，无可校验的第二因素）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '429':
          description: RATE_LIMIT_MFA_ATTEMPTS（尝试次数用尽，该挑战作废，需重新登录）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '503':
          description: AUTHN_MFA_UNAVAILABLE（该部署未接线 MFA 存储）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/mfa/enroll/start:
    post:
      operationId: startMfaEnrollment
      summary: 开始 MFA 注册（生成密钥与 otpauth URI）
      description: |
        仅在已确认会话上可用。密钥在确认之前不改变登录要求；
        已启用 MFA 的账号返回 409 AUTHN_MFA_ALREADY_ENROLLED（需先关闭再重新注册）。
      tags: [auth]
      responses:
        '200':
          description: 返回 secret / otpauth_uri / digits / period_seconds（secret 只在本次响应出现）
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '401':
          description: 未认证或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 缺少所需权限或 CSRF 校验失败
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '409':
          description: AUTHN_MFA_ALREADY_ENROLLED（已启用 MFA）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '503':
          description: AUTHN_MFA_UNAVAILABLE（该部署未接线 MFA 存储）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/mfa/enroll/confirm:
    post:
      operationId: confirmMfaEnrollment
      summary: 用一次正确验证码确认 MFA 注册，并一次性下发恢复码
      description: |
        恢复码明文只在本次响应出现一次，库中仅存摘要；审计写 auth:mfa:enroll。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 认证器上的一次性验证码 }
      responses:
        '200':
          description: 返回 enrolled=true 与 recovery_codes（一次性明文列表）
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '401':
          description: AUTHN_MFA_INVALID（验证码不正确）或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 缺少所需权限或 CSRF 校验失败
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '409':
          description: AUTHN_MFA_ALREADY_ENROLLED（已启用）或 AUTHN_MFA_NOT_ENROLLED（尚未开始注册）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '503':
          description: AUTHN_MFA_UNAVAILABLE（该部署未接线 MFA 存储）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/mfa/disable:
    post:
      operationId: disableMfa
      summary: 自助关闭 MFA（删除密钥与全部恢复码）
      description: 审计写 auth:mfa:disable。关闭后登录不再要求第二因素。
      tags: [auth]
      responses:
        '200':
          description: 返回 enrolled=false
          content:
            application/json:
              schema: { $ref: './common/envelope.yaml#/Envelope' }
        '401':
          description: 未认证或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 缺少所需权限或 CSRF 校验失败
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '503':
          description: AUTHN_MFA_UNAVAILABLE（该部署未接线 MFA 存储）
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC 授权码回调
      description: 尚未接入 IdP（NOT_IMPLEMENTED），返回 501；未实现前不得对外宣称支持 OIDC。
      tags: [auth]
      security: []
      responses:
        '501':
          description: 未实现
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

  /api/auth/v1/oidc/start:
    get:
      operationId: oidcStart
      summary: 开始 OIDC 授权码流程
      description: 尚未接入 IdP（NOT_IMPLEMENTED），返回 501。
      tags: [auth]
      responses:
        '501':
          description: 未实现
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '401':
          description: 未认证或会话失效
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }
        '403':
          description: 缺少所需权限或 CSRF 校验失败
          content:
            application/json:
              schema: { $ref: './common/errors.yaml#/ErrorEnvelope' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cs_user_session
      description: |
        用户层会话（后台会话为 cs_admin_session）。HttpOnly，前端 JS 不可读；
        跨受众访问一律拒绝。
security:
  - sessionCookie: []
