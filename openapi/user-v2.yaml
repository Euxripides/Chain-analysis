components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cs_user_session
  schemas:
    ExplorerFilter:
      type: object
      properties:
        chain: &id001
          type: string
        addresses:
          type: array
          maxItems: 100
          items: *id001
        datasets:
          type: array
          items: *id001
        token: &id005
          type: string
          description: Contract(s), or a case-insensitive partial symbol; chain and
            contract remain asset identity.
        direction: &id006
          type: string
          enum:
          - ''
          - in
          - out
          - self
          - internal
        counterparty: *id001
        from_address: *id001
        to_address: *id001
        hide_zero:
          type: boolean
        from_time: &id002
          type:
          - string
          - 'null'
          format: date-time
        to_time: *id002
        as_of: *id002
        min_amount: &id007
          type: string
          pattern: ^\d+(\.\d+)?$
        max_amount: &id008
          type: string
          pattern: ^\d+(\.\d+)?$
        block_from: &id003
          type: integer
          minimum: 0
        block_to: *id003
        interval: &id009
          type: string
          enum:
          - day
          - hour
        timezone: &id010
          type: string
          description: IANA timezone, default Asia/Shanghai.
    AssetFlowTotal:
      type: object
      properties:
        in_raw: &id004
          type: string
          pattern: ^-?\d+$
          description: Exact integer; never converted through floating point.
        out_raw: *id004
        net_raw: *id004
        internal_raw: *id004
        self_raw: *id004
        token_decimals: *id003
        event_count: *id003
        transaction_count: *id003
        missing_amount_rows: *id003
        failed_event_count: *id003
        dataset: *id001
        token_address: *id001
        token_symbol: *id001
        first_seen: *id002
        last_seen: *id002
      required:
      - in_raw
      - out_raw
      - net_raw
      - internal_raw
      - self_raw
      - token_decimals
      - event_count
      - transaction_count
      - missing_amount_rows
      - failed_event_count
      - dataset
      - token_address
      - token_symbol
      - first_seen
      - last_seen
    StatisticsGroup:
      type: object
      properties:
        key: *id001
        total:
          $ref: '#/components/schemas/AssetFlowTotal'
        counterparty: *id001
        address: *id001
        bucket: *id001
        common_addresses:
          type: array
          items: *id001
        share_percent: *id001
      required:
      - key
      - total
    ExplorerStatistics:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/ExplorerFilter'
        data_version: *id001
        transaction_count: *id003
        event_count: *id003
        counterparty_count: *id003
        first_seen: *id002
        last_seen: *id002
        top_transfers:
          type: array
          items:
            type: object
            properties:
              dataset: *id001
              tx_hash: *id001
              event_index: *id003
              token_address: *id001
              token_symbol: *id001
              token_decimals: *id003
              timestamp: *id002
              from_address: *id001
              to_address: *id001
              amount_raw: *id001
              source_ingested_at: *id002
              status: *id003
              block_number: *id003
        assets:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsGroup'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsGroup'
        hours:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsGroup'
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsGroup'
        counterparties:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsGroup'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsGroup'
      required:
      - filter
      - data_version
      - transaction_count
      - event_count
      - counterparty_count
      - first_seen
      - last_seen
      - top_transfers
      - assets
      - trend
      - hours
      - distribution
      - counterparties
      - addresses
    DatasetFile:
      type: object
      properties:
        dataset: *id001
        name: *id001
        rows: *id003
        bytes: *id003
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        download_available:
          type: boolean
      required:
      - dataset
      - name
      - rows
      - bytes
      - sha256
      - download_available
    ExportResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type:
          - string
          - 'null'
        dataset: *id001
        format:
          type: string
          enum:
          - csv
          - xlsx
          - jsonl
          - parquet
        zip:
          type: boolean
        status: *id001
        rows: *id003
        bytes:
          type:
          - integer
          - 'null'
        sha256: *id001
        created_at: *id002
        finished_at: *id002
        expires_at: *id002
        download_available:
          type: boolean
        files:
          type: array
          items:
            $ref: '#/components/schemas/DatasetFile'
    ExportRequest:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        chain: *id001
        addresses:
          type: array
          minItems: 1
          maxItems: 100
          items: *id001
        datasets:
          type: array
          items: *id001
        format:
          type: string
          enum:
          - csv
          - xlsx
          - jsonl
          - parquet
        content:
          type: string
          enum:
          - details
          - statistics
          - counterparties
        file_layout:
          type: string
          enum:
          - dataset
          description: Exactly one file per dataset; multiple datasets form a ZIP.
        filters:
          $ref: '#/components/schemas/ExplorerFilter'
        start_time: *id002
        end_time: *id002
        include_meta:
          type: boolean
        include_decoded_input:
          type: boolean
        force_zip:
          type: boolean
      required:
      - format
